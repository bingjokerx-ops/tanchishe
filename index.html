<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f23;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

h1 {
  font-size: 2rem;
  margin: 16px 0 8px;
  background: linear-gradient(135deg, #00d26a, #00a8ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 4px;
}

.score-bar {
  display: flex;
  gap: 24px;
  font-size: 1.1rem;
  margin-bottom: 8px;
}

.score-bar span {
  background: rgba(255,255,255,0.06);
  padding: 4px 16px;
  border-radius: 8px;
}

.score-bar .val { color: #00d26a; font-weight: 700; }

/* Speed progress bar */
.speed-bar-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.speed-bar-label {
  font-size: 0.78rem;
  color: #888;
  white-space: nowrap;
}

.speed-bar-track {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  overflow: hidden;
}

.speed-bar-fill {
  height: 100%;
  width: 50%;
  border-radius: 3px;
  transition: width 0.3s ease, background-color 0.3s ease;
  background: #00d26a;
}

#game-wrapper {
  position: relative;
  border: 2px solid #1a1a3e;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(0, 210, 106, 0.08);
}

canvas {
  display: block;
  background: #141428;
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(15, 15, 35, 0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 10;
  transition: opacity 0.25s;
}

.overlay.hidden { opacity: 0; pointer-events: none; }

.overlay h2 {
  font-size: 1.6rem;
  color: #fff;
}

.overlay .final-score {
  font-size: 1.2rem;
  color: #00d26a;
}

.btn {
  padding: 10px 32px;
  font-size: 1rem;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  transition: transform 0.15s, box-shadow 0.15s;
}

.btn:active { transform: scale(0.95); }

.btn-primary {
  background: linear-gradient(135deg, #00d26a, #00a8ff);
  color: #fff;
}

.btn-secondary {
  background: rgba(255,255,255,0.1);
  color: #e0e0e0;
}

.btn-secondary:hover { background: rgba(255,255,255,0.18); }

.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 0;
  flex-wrap: wrap;
  justify-content: center;
}

/* Speed slider control */
.speed-control {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.06);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 0.9rem;
  color: #aaa;
}

.speed-control label {
  white-space: nowrap;
  cursor: default;
}

.speed-control input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 110px;
  height: 6px;
  background: rgba(255,255,255,0.12);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
  transition: background 0.2s;
}

.speed-control input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00d26a, #00a8ff);
  cursor: pointer;
  box-shadow: 0 0 6px rgba(0, 210, 106, 0.5);
  transition: transform 0.15s;
}

.speed-control input[type=range]::-webkit-slider-thumb:active {
  transform: scale(1.2);
}

.speed-control input[type=range]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00d26a, #00a8ff);
  cursor: pointer;
  border: none;
  box-shadow: 0 0 6px rgba(0, 210, 106, 0.5);
}

.speed-num {
  color: #00d26a;
  font-weight: 700;
  min-width: 14px;
  text-align: center;
  font-size: 1rem;
}

/* Mobile D-pad */
.dpad {
  display: none;
  grid-template-areas:
    ". up ."
    "left . right"
    ". down .";
  grid-template-columns: repeat(3, 60px);
  grid-template-rows: repeat(3, 60px);
  gap: 6px;
  margin-top: 12px;
}

.dpad button {
  width: 60px;
  height: 60px;
  border: none;
  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  color: #e0e0e0;
  font-size: 1.6rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.1s;
}

.dpad button:active { background: rgba(0, 210, 106, 0.3); }

.dpad .up    { grid-area: up; }
.dpad .down  { grid-area: down; }
.dpad .left  { grid-area: left; }
.dpad .right { grid-area: right; }

.instructions {
  max-width: 460px;
  margin: 16px auto 24px;
  padding: 16px 20px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  font-size: 0.9rem;
  line-height: 1.7;
  color: #aaa;
}

.instructions h3 { color: #ccc; margin-bottom: 6px; }
.instructions kbd {
  background: rgba(255,255,255,0.1);
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 0.85rem;
}

@media (max-width: 520px) {
  h1 { font-size: 1.5rem; margin-top: 10px; }
  .dpad { display: grid; }
  .instructions { margin: 10px 12px 20px; }
  .speed-control input[type=range] { width: 90px; }
  .controls { gap: 8px; }
}
</style>
</head>
<body>

<h1>贪 吃 蛇</h1>

<div class="score-bar">
  <span>得分: <span class="val" id="score">0</span></span>
  <span>最高: <span class="val" id="best">0</span></span>
</div>

<div class="speed-bar-wrapper" id="speed-bar-wrapper">
  <span class="speed-bar-label">速度</span>
  <div class="speed-bar-track">
    <div class="speed-bar-fill" id="speed-bar-fill"></div>
  </div>
</div>

<div id="game-wrapper">
  <canvas id="canvas"></canvas>

  <div class="overlay" id="overlay-start">
    <h2>贪吃蛇</h2>
    <button class="btn btn-primary" id="btn-start">开始游戏</button>
  </div>

  <div class="overlay hidden" id="overlay-over">
    <h2>游戏结束</h2>
    <div class="final-score" id="final-score"></div>
    <button class="btn btn-primary" id="btn-restart">重新开始</button>
  </div>
</div>

<div class="controls">
  <button class="btn btn-secondary" id="btn-pause">暂停</button>
  <div class="speed-control">
    <label for="speed-slider">速度</label>
    <input type="range" id="speed-slider" min="1" max="10" value="5">
    <span class="speed-num" id="speed-num">5</span>
  </div>
</div>

<div class="dpad" id="dpad">
  <button class="up">&#9650;</button>
  <button class="left">&#9664;</button>
  <button class="right">&#9654;</button>
  <button class="down">&#9660;</button>
</div>

<div class="instructions">
  <h3>游戏说明</h3>
  <p>
    PC端：使用 <kbd>&#8593;</kbd> <kbd>&#8595;</kbd> <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向，<kbd>Space</kbd> 暂停/继续。<br>
    移动端：使用屏幕下方方向键或在画布上滑动控制方向。<br>
    拖动速度滑块调整游戏速度（1=最慢，10=最快）。吃到食物得 10 分，撞墙或撞自己则游戏结束。
  </p>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlayStart = document.getElementById('overlay-start');
  const overlayOver = document.getElementById('overlay-over');
  const finalScoreEl = document.getElementById('final-score');
  const btnStart = document.getElementById('btn-start');
  const btnRestart = document.getElementById('btn-restart');
  const btnPause = document.getElementById('btn-pause');
  const speedSlider = document.getElementById('speed-slider');
  const speedNumEl = document.getElementById('speed-num');
  const speedBarFill = document.getElementById('speed-bar-fill');
  const speedBarWrapper = document.getElementById('speed-bar-wrapper');

  const CELL = 20;
  let cols, rows, cw, ch;
  let snake, dir, nextDir, food, score, best, speed, running, paused, animId, lastTime;
  let userSpeedLevel = 5; // 1–10, controlled by slider
  let autoBoostMs = 0;    // extra speed gained from eating food

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  // Map slider level (1–10) → interval in ms (slow=200ms, fast=50ms)
  function levelToMs(level) {
    return Math.round(200 - (level - 1) * (150 / 9));
  }

  // Map current ms interval → 0–100% for bar display
  function msToPercent(ms) {
    const minMs = 30;
    const maxMs = 200;
    return Math.round((1 - (ms - minMs) / (maxMs - minMs)) * 100);
  }

  // Hue: 120 (green) at slow, 0 (red) at fast
  function percentToColor(pct) {
    const hue = Math.round(120 - pct * 1.2);
    return `hsl(${Math.max(0, hue)}, 80%, 50%)`;
  }

  function updateSpeedBar() {
    const pct = msToPercent(speed);
    const clamped = Math.min(100, Math.max(4, pct));
    speedBarFill.style.width = clamped + '%';
    speedBarFill.style.backgroundColor = percentToColor(clamped);
  }

  function resize() {
    const maxW = Math.min(window.innerWidth - 24, 480);
    const maxH = Math.min(window.innerHeight - 320, 480);
    const size = Math.min(maxW, maxH);
    cols = Math.floor(size / CELL);
    rows = cols;
    cw = cols * CELL;
    ch = rows * CELL;
    canvas.width = cw;
    canvas.height = ch;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    const wrapper = document.getElementById('game-wrapper');
    wrapper.style.width = cw + 'px';
    wrapper.style.height = ch + 'px';
    // Match speed bar width to game canvas
    speedBarWrapper.style.width = cw + 'px';
    if (running && !paused) draw();
  }

  function init() {
    const cx = Math.floor(cols / 2);
    const cy = Math.floor(rows / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    autoBoostMs = 0;
    speed = levelToMs(userSpeedLevel);
    scoreEl.textContent = 0;
    updateSpeedBar();
    placeFood();
  }

  function placeFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
    } while (occupied.has(pos.x + ',' + pos.y));
    food = pos;
  }

  function draw() {
    ctx.clearRect(0, 0, cw, ch);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= cols; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ch); ctx.stroke();
    }
    for (let y = 0; y <= rows; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(cw, y * CELL); ctx.stroke();
    }

    // food
    const fx = food.x * CELL + CELL / 2;
    const fy = food.y * CELL + CELL / 2;
    ctx.beginPath();
    ctx.arc(fx, fy, CELL / 2 - 2, 0, Math.PI * 2);
    ctx.fillStyle = '#ff4757';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(fx - 2, fy - 3, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();

    // snake
    snake.forEach((seg, i) => {
      const sx = seg.x * CELL + CELL / 2;
      const sy = seg.y * CELL + CELL / 2;
      ctx.beginPath();
      ctx.roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 5);
      const t = i / snake.length;
      ctx.fillStyle = `hsl(${145 - t * 30}, 80%, ${55 - t * 15}%)`;
      ctx.fill();

      if (i === 0) {
        // eyes
        const ex1 = sx + dir.y * 4 + dir.x * 3;
        const ey1 = sy - dir.x * 4 + dir.y * 3;
        const ex2 = sx - dir.y * 4 + dir.x * 3;
        const ey2 = sy + dir.x * 4 + dir.y * 3;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex1, ey1, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2, ey2, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(ex1 + dir.x, ey1 + dir.y, 1.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2 + dir.x, ey2 + dir.y, 1.2, 0, Math.PI * 2); ctx.fill();
      }
    });
  }

  function step(ts) {
    if (!running) return;
    animId = requestAnimationFrame(step);
    if (paused) return;
    if (ts - lastTime < speed) return;
    lastTime = ts;

    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // collision
    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      // Auto-speed boost from eating (up to 80ms extra reduction)
      if (autoBoostMs < 80) autoBoostMs += 3;
      speed = Math.max(30, levelToMs(userSpeedLevel) - autoBoostMs);
      updateSpeedBar();
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function start() {
    overlayStart.classList.add('hidden');
    overlayOver.classList.add('hidden');
    init();
    running = true;
    paused = false;
    btnPause.textContent = '暂停';
    lastTime = 0;
    draw();
    animId = requestAnimationFrame(step);
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(animId);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snake_best', best);
    }
    finalScoreEl.textContent = '得分: ' + score;
    overlayOver.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    btnPause.textContent = paused ? '继续' : '暂停';
  }

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return; // can't reverse
    nextDir = { x, y };
  }

  // Speed slider
  speedSlider.addEventListener('input', () => {
    userSpeedLevel = parseInt(speedSlider.value, 10);
    speedNumEl.textContent = userSpeedLevel;
    // Recalculate speed preserving any auto-boost
    speed = Math.max(30, levelToMs(userSpeedLevel) - autoBoostMs);
    updateSpeedBar();
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp': case 'w': case 'W': e.preventDefault(); setDir(0, -1); break;
      case 'ArrowDown': case 's': case 'S': e.preventDefault(); setDir(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); setDir(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': e.preventDefault(); setDir(1, 0); break;
      case ' ': e.preventDefault(); togglePause(); break;
    }
  });

  // Buttons
  btnStart.addEventListener('click', start);
  btnRestart.addEventListener('click', start);
  btnPause.addEventListener('click', togglePause);

  // D-pad
  document.querySelector('.dpad .up').addEventListener('click', () => setDir(0, -1));
  document.querySelector('.dpad .down').addEventListener('click', () => setDir(0, 1));
  document.querySelector('.dpad .left').addEventListener('click', () => setDir(-1, 0));
  document.querySelector('.dpad .right').addEventListener('click', () => setDir(1, 0));

  // Swipe
  let tx, ty;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    tx = t.clientX; ty = t.clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - tx;
    const dy = t.clientY - ty;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  window.addEventListener('resize', resize);
  resize();
  // Initialize speed bar to default level before any game starts
  speed = levelToMs(userSpeedLevel);
  updateSpeedBar();
  draw();
})();
</script>
</body>
</html>
